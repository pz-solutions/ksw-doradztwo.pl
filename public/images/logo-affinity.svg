        id="coin-shadow"
        inkscape:label="Cień monety"
        cx="45"
        cy="58"
        rx="31"
        ry="3.5"
        fill="#555555"
        opacity="0.25"
        filter="url(#soft-shadow)"
      />

      <path
        id="coin-edge"
        inkscape:label="Grubość i rant monety"
        d="M6 39 C6 49 23 55 45 55 C67 55 84 49 84 39 L84 47 C82 57 65 62 45 62 C25 62 8 57 6 47 Z"
        fill="url(#coin-edge)"
        stroke="#b0b0b0"
        stroke-width="1"
      />

      <ellipse
        id="coin-top-surface"
        inkscape:label="Górna powierzchnia monety"
        cx="45"
        cy="39"
        rx="39"
        ry="14"
        fill="url(#coin-top)"
        stroke="url(#silver)"
        stroke-width="1.5"
      />

