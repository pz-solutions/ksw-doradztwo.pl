<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="340"
  height="82"
  viewBox="0 0 340 82"
  role="img"
  aria-labelledby="logo-title logo-description"
>
  <title id="logo-title">KSW Doradztwo</title>
  <desc id="logo-description">Wektorowa wersja logo KSW Doradztwo z literami zamienionymi na krzywe dla Affinity Designer.</desc>

  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#666666" />
      <stop offset="0.35" stop-color="#d8d8d8" />
      <stop offset="0.62" stop-color="#8b8b8b" />
      <stop offset="1" stop-color="#4a4a4a" />
    </linearGradient>
    <linearGradient id="silver-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a" />
      <stop offset="0.5" stop-color="#9d9d9d" />
      <stop offset="1" stop-color="#5c5c5c" />
    </linearGradient>
    <linearGradient id="coin-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.55" stop-color="#f3f3f3" />
      <stop offset="1" stop-color="#c9c9c9" />
    </linearGradient>
    <linearGradient id="coin-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eeeeee" />
      <stop offset="0.4" stop-color="#b8b8b8" />
      <stop offset="0.7" stop-color="#eeeeee" />
      <stop offset="1" stop-color="#8b8b8b" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="1.4" />
    </filter>
  </defs>

  <g id="background" inkscape:groupmode="layer" inkscape:label="Tło i obramowanie">
    <rect y="8" width="104" height="66" fill="#000000" />
    <rect x="2" y="10" width="102" height="62" fill="#ffffff" />
    <rect x="104" y="8" width="236" height="66" fill="#ffffff" />
    <rect x="104" y="10" width="234" height="62" fill="#000000" />
  </g>

